services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set the public HTTPS API URL in the host environment}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set the Supabase project URL in the host environment}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set the Supabase publishable/anon key in the host environment}
    ports:
      - "127.0.0.1:8033:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    env_file:
      - ./ai_engine/.env
    environment:
      ASR_MODEL_PATH: /models/yoruba-whisper
      ASR_OFFLINE_ONLY: "true"
      ASR_ENABLE_DIARIZATION: "false"
      ALLOWED_ORIGINS: ""
    volumes:
      # Provision the approved offline model on the deployment host before
      # starting containers. The model is read-only at runtime.
      - ./models/yoruba-whisper:/models/yoruba-whisper:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENVIRONMENT: production
      AI_ENGINE_URL: http://ai_engine:8001
    depends_on:
      ai_engine:
        condition: service_healthy
    # Publish only to loopback. Put an HTTPS reverse proxy/WAF in front of it;
    # never expose the AI engine directly.
    ports:
      - "127.0.0.1:8022:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
